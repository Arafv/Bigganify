name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            autoconf \
            libtool \
            pkg-config \
            ccache \
            zip \
            unzip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bigganify-APK
          path: bin/*.apk          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bigganify-APK
          path: |
            bin/*.apk
            .buildozer/**/*.apk
          if-no-files-found: error          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      - name: Build APK
        run: buildozer -v android debug

      - name: Show APK files
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bigganify-APK
          path: |
            bin/*.apk
            .buildozer/**/*.apk
          if-no-files-found: error
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Configure Bigganify App Name
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          sed -i 's/^title = .*/title = Bigganify/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = bigganify/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Bigganify APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bigganify-APK
          path: bin/*.apk            libtool pkg-config cmake ant ccache unzip zip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Configure Bigganify App Name
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          sed -i 's/^title = .*/title = Bigganify/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = bigganify/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Bigganify APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bigganify-APK
          path: bin/*.apk
            libtool pkg-config cmake ant ccache unzip zip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Generate or Update buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          sed -i 's/^title = .*/title = Bigganify/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = bigganify/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Bigganify APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bigganify-APK
          path: bin/*.apk
