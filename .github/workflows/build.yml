name: Build Bigganify APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev gettext autopoint

          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      - name: Build APK
        run: buildozer -v android debug

      - name: Show APK files
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bigganify-APK
          path: |
            bin/*.apk
            .buildozer/**/*.apk
          if-no-files-found: error
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Configure Bigganify App Name
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          sed -i 's/^title = .*/title = Bigganify/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = bigganify/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Bigganify APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bigganify-APK
          path: bin/*.apk            libtool pkg-config cmake ant ccache unzip zip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Configure Bigganify App Name
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          sed -i 's/^title = .*/title = Bigganify/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = bigganify/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Bigganify APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bigganify-APK
          path: bin/*.apk
            libtool pkg-config cmake ant ccache unzip zip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Generate or Update buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          sed -i 's/^title = .*/title = Bigganify/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = bigganify/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Bigganify APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bigganify-APK
          path: bin/*.apk
