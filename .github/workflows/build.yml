name: CI Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the repository files down to the runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configure the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Adjust this to your required Python version

    # 3. Robust, fault-tolerant dependency installation
    - name: Install System Dependencies
      run: |
        echo "Clearing corrupted or old apt lists..."
        sudo rm -rf /var/lib/apt/lists/*
        
        echo "Updating apt repositories with fallback logic..."
        for i in {1..3}; do 
          sudo apt-get update && break || { echo "Retry $i failed, sleeping..."; sleep 5; }
        done

        echo "Installing required packages..."
        # Replace 'build-essential libpq-dev' with your actual system dependencies
        sudo apt-get install -y --fix-missing build-essential libpq-dev

    # 4. Install your Python dependencies (Example baseline)
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
